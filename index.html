<style>
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 Tahoma,Verdana,sans-serif;background:#5b7a9d;color:#000;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 50px)}
body.dark{background:#1a2332;color:#e0e0e0}
.top{background:#1d2b44;color:#fff;padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top .acts{display:flex;gap:4px}
.top .acts button{min-height:28px;padding:0 8px;font-size:12px}

.bar{padding:6px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #aaa;flex-wrap:wrap}

body.dark .ok{color:#4ade80}body.dark .no{color:#f87171}
.hint{font-size:12px;color:#444;padding:8px 10px;line-height:1.5}

#co div{padding:3px 0;font-size:13px}
#co .ok::before{content:"✓ ";font-weight:bold}
#co .no::before{content:"✗ ";font-weight:bold}
.cli{background:#0d1117;color:#7ee787;font-family:'Courier New',monospace;font-size:12px;padding:10px;white-space:pre-wrap;word-break:break-all;border-radius:3px;line-height:1.5}
.prog{position:fixed;bottom:0;left:0;right:0;background:#0a246a;color:#fff;padding:8px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;z-index:50;box-shadow:0 -2px 8px #0004}

.toast button{min-height:24px;padding:0 8px;font-size:11px;background:#3a4a60;color:#fff;border-color:#fff}

<body>
<div class="top">
  <span><b>WinBox</b> admin@192.168.88.1</span>
  <span class="acts">
    <button onclick="undo()" title="Undo">↶</button>
    <button onclick="toggleDark()" title="Dark mode">🌙</button>
  </span>
</div>
<div class="menu" id="m"></div>
<div id="v"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IF=['ether1','ether2','wlan1'];
const D=()=>({addr:[],pool:[],dhcp:[],hs:[],user:[],fw:[],dns:[],dnsSet:{servers:'',allow:false}});
let R,cur='if',undoStack=[];
try{R=JSON.parse(localStorage.getItem('mt')||'')}catch(e){}
if(!R||!R.addr||!R.dnsSet)R=D();
if(!R.dns)R.dns=[];if(!R.fw)R.fw=[];

function toast(msg,withClose){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<span>'+esc(msg)+'</span>'+(withClose?'<button type="button">Tutup</button>':'');
  document.body.appendChild(t);
  const kill=()=>{t.style.opacity='0';t.style.transition='opacity .2s';setTimeout(()=>t.remove(),200)};
  if(withClose)t.querySelector('button').onclick=kill;
  else setTimeout(kill,2500);
}
const save=()=>{try{localStorage.setItem('mt',JSON.stringify(R))}catch(e){toast('⚠ Gagal simpan: storage penuh',true)}};
const pushUndo=()=>{undoStack.push(JSON.stringify(R));if(undoStack.length>20)undoStack.shift()};
function undo(){
  if(!undoStack.length){toast('Tidak ada yang bisa di-undo');return}
  R=JSON.parse(undoStack.pop());save();render();toast('Di-undo');
}

const S={
 addr:{m:'IP ▸ Addresses',t:'Address List',f:[['address','text','192.168.88.1/24','Format: IP/prefix, misal 192.168.88.1/24'],['interface','sel',IF]]},
 pool:{m:'IP ▸ Pool',t:'IP Pool',f:[['name','text','pool-hs','Nama bebas, misal pool-hs'],['ranges','text','192.168.88.10-192.168.88.254','Format: awal-akhir, harus di dalam subnet wlan1']]},
 dhcp:{m:'IP ▸ DHCP Server',t:'DHCP Servers',f:[['name','text','dhcp1',''],['interface','sel',IF],['address-pool','pool']]},
 hs:{m:'IP ▸ Hotspot',t:'Hotspot Servers',f:[['name','text','hotspot1',''],['interface','sel',IF],['address-pool','pool']]},
 user:{m:'Hotspot Users',t:'Hotspot Users',f:[['name','text','siswa1','Username login hotspot'],['password','text','123','Password login hotspot']]},
 fw:{m:'IP ▸ Firewall',t:'Firewall Rules',f:[['chain','sel',['forward','srcnat'],'srcnat untuk masquerade, forward untuk blokir'],['action','sel',['drop','reject','masquerade']],['content','text','tiktok.com','Kosongkan untuk NAT. Isi untuk blokir'],['out-interface','sel',['','ether1','ether2','wlan1']]]},
 dns:{m:'IP ▸ DNS',t:'DNS Static',f:[['name','text','facebook.com','Domain yang mau diblokir'],['address','text','127.0.0.1','Arahkan ke 127.0.0.1 untuk memblokir']]}
};
const H={
 hs:'Tes klien virtual memakai wlan1, jadi pasang Hotspot Server di wlan1.',
 fw:'Masquerade: chain=srcnat, action=masquerade. Blokir situs: chain=forward, action=drop, isi content.',
 dns:'Blokir via DNS Static: arahkan name ke 127.0.0.1. Isi DNS Servers dan centang Allow Remote Requests.'
};
const MN=[['if','Interfaces'],...Object.entries(S).map(([k,s])=>[k,s.m]),['cli','CLI'],['cl','HP Klien'],['ms','Misi']];

const ip2n=s=>{const p=String(s).split('.').map(Number);return p.length===4&&p.every(x=>Number.isInteger(x)&&x>=0&&x<=255)?p[0]*16777216+p[1]*65536+p[2]*256+p[3]:NaN};
const inNet=(ip,cidr)=>{
  if(!cidr)return false;
  const parts=String(cidr).split('/');
  const a=parts[0],l=parts[1]===undefined?32:+parts[1];
  if(isNaN(ip)||isNaN(ip2n(a))||!(l>=0&&l<=32))return false;
  const m=l===0?0:(0xFFFFFFFF<<(32-l))>>>0;
  return((ip&m)>>>0)===((ip2n(a)&m)>>>0);
};

const V={
 addr:o=>{if(!o.address)return 'Isi address';const[a,l]=o.address.split('/');if(isNaN(ip2n(a))||l===undefined||l===''||!(+l>=0&&+l<=32))return 'Format salah. Contoh: 192.168.88.1/24';return ''},
 pool:o=>{
   if(!o.name)return 'Isi name pool';
   const r=o.ranges.split('-');
   if(r.length!==2||isNaN(ip2n(r[0]))||isNaN(ip2n(r[1])))return 'Format ranges salah. Contoh: 192.168.88.10-192.168.88.254';
   if(ip2n(r[0])>ip2n(r[1]))return 'IP awal harus ≤ IP akhir';
   const ad=R.addr.find(a=>a.interface==='wlan1');
   if(ad){const[a,l]=ad.address.split('/');if(l&&!inNet(ip2n(r[0]),ad.address)&&!inNet(ip2n(r[1]),ad.address))return 'Pool harus di dalam subnet wlan1 ('+ad.address+')';}
   return '';
 },
 dhcp:o=>{if(!o.name)return 'Isi name';if(!o['address-pool'])return 'Buat IP Pool dulu';if(R.dhcp.some(d=>d.interface===o.interface))return 'Interface '+o.interface+' sudah punya DHCP';return ''},
 hs:o=>{if(!o.name)return 'Isi name';if(!o['address-pool'])return 'Buat IP Pool dulu';if(R.hs.some(h=>h.interface===o.interface))return 'Interface '+o.interface+' sudah punya Hotspot';return ''},
 user:o=>{if(!o.name||!o.password)return 'Isi name dan password';if(R.user.some(u=>u.name===o.name))return 'Username sudah dipakai';return ''},
 fw:o=>{
   if(o.action==='masquerade'&&o.chain!=='srcnat')return 'masquerade hanya di chain srcnat';
   if((o.action==='drop'||o.action==='reject')&&o.chain!=='forward')return 'drop/reject harus di chain forward';
   if((o.action==='drop'||o.action==='reject')&&!o.content)return 'Rule blokir tanpa content akan blokir SEMUA trafik. Isi content dulu.';
   if(o.action==='masquerade'&&o.content)return 'Masquerade tidak butuh content, kosongkan';
   return '';
 },
 dns:o=>{if(!o.name)return 'Isi name';if(isNaN(ip2n(o.address)))return 'Address harus IP valid';return ''}
};

const win=(t,b)=>`<div class="win"><div class="tb">${t}</div>${b}</div>`;

function dlg(h){
  const old=document.getElementById('dlg');
  if(old)old.remove();
  const d=document.createElement('div');
  d.className='dlg';
  d.id='dlg';
  d.innerHTML=h;
  d.addEventListener('click',e=>{if(e.target===d)closeD()});
  document.body.appendChild(d);
  return d;
}
function closeD(){
  const d=document.getElementById('dlg');
  if(d)d.remove();
}

function form(k,idx){
  const s=S[k];
  const isEdit=typeof idx==='number';
  const existing=isEdit?R[k][idx]:{};
  const h=s.f.map(([n,t,x,ph])=>{
    const hint=ph?`<div class="helper">${esc(ph)}</div>`:'';
    const val=existing[n]!==undefined?existing[n]:'';
    if(t==='text'){
      return `<label for="f_${n}">${n}</label>
        <input id="f_${n}" type="text" value="${esc(val)}" placeholder="${esc(x)}"
          autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">${hint}`;
    }
    const o=t==='pool'?R.pool.map(p=>p.name):x;
    if(!o.length){
      return `<label>${n}</label><div class="no" style="font-size:12px;padding:6px">Belum ada pilihan. Buat dulu di menu terkait.</div>`;
    }
    const curVal=val||o[0];
    return `<label for="f_${n}">${n}</label>
      <select id="f_${n}">${o.map(v=>`<option value="${esc(v)}" ${v===curVal?'selected':''}>${esc(v)}</option>`).join('')}</select>${hint}`;
  }).join('');
  dlg(`<div class="win">
    <div class="tb">${isEdit?'Edit':'New'} ${s.t}</div>
    <div class="p">${h}<div id="err" class="no" style="margin-top:8px"></div></div>
    <div class="bar" style="justify-content:flex-end">
      <button type="button" onclick="saveForm('${k}',${isEdit?idx:'null'})">OK</button>
      <button type="button" onclick="closeD()">Cancel</button>
    </div>
  </div>`);
  requestAnimationFrame(()=>{
    const first=document.querySelector('#dlg input, #dlg select');
    if(first)first.focus({preventScroll:true});
  });
}
function saveForm(k,idx){
  const o={};
  let missing=false;
  S[k].f.forEach(([n])=>{
    const el=document.getElementById('f_'+n);
    if(!el){missing=true;return}
    o[n]=el.value.trim();
  });
  if(missing){const e=document.getElementById('err');if(e)e.textContent='Form tidak lengkap.';return}
  const e=V[k](o);
  if(e){const el=document.getElementById('err');if(el)el.textContent=e;return}
  pushUndo();
  if(typeof idx==='number')R[k][idx]=o;
  else R[k].push(o);
  save();closeD();render();toast(typeof idx==='number'?'Diubah':'Ditambahkan');
}
function del(k,i){
  if(!confirm('Hapus item ini?'))return;
  pushUndo();R[k].splice(i,1);save();render();toast('Dihapus');
}
function dup(k,i){
  pushUndo();
  const copy=JSON.parse(JSON.stringify(R[k][i]));
  if(copy.name)copy.name=copy.name+'-copy';
  R[k].push(copy);save();render();toast('Diduplikasi');
}
function reset(){
  if(!confirm('Reset SEMUA konfigurasi router?'))return;
  pushUndo();R=D();save();render();toast('Router direset');
}

function sim(u,p,site,method){
 method=(method||'https').toLowerCase();
 const L=[],r={log:L,net:false,blocked:null,dhcpFail:false};
 const bad=m=>{L.push(['✗',m]);return r},ok=m=>L.push(['✓',m]);
 const hs=R.hs.find(h=>h.interface==='wlan1');
 if(!hs)return bad('SSID hotspot tidak terdeteksi di wlan1. Buat Hotspot Server di wlan1 dulu.');
 ok('SSID hotspot terdeteksi: '+hs.name);
 const ad=R.addr.find(a=>a.interface==='wlan1'),dh=R.dhcp.find(d=>d.interface==='wlan1');
 if(!ad)return bad('wlan1 belum punya IP address.');
 if(!dh){r.dhcpFail=true;return bad('Tidak ada DHCP Server di wlan1. HP tidak dapat IP (169.254.x.x).')}
 const pl=R.pool.find(x=>x.name===dh['address-pool']);
 if(!pl||!pl.ranges.split('-').every(x=>inNet(ip2n(x),ad.address)))return bad('Pool DHCP di luar subnet wlan1.');
 ok('HP mendapat IP '+pl.ranges.split('-')[0]);
 if(!R.user.some(x=>x.name===u&&x.password===p))return bad('Login hotspot gagal: user/password salah.');
 ok('Login hotspot berhasil');
 if(!R.fw.some(f=>f.chain==='srcnat'&&f.action==='masquerade'))return bad('Tidak ada internet: butuh NAT masquerade (chain=srcnat).');
 if(R.fw.some(f=>f.chain==='forward'&&f.action!=='masquerade'&&!f.content))return bad('Rule firewall forward tanpa content memblokir SEMUA trafik.');
 if(!R.dnsSet.servers||!R.dnsSet.allow)return bad('DNS gagal: isi DNS Servers dan centang Allow Remote Requests.');
 r.net=true;ok('Internet dan DNS siap');
 const d=R.dns.find(x=>(site===x.name||site.endsWith('.'+x.name))&&/^(127\.0\.0\.1|0\.0\.0\.0)$/.test(x.address));
 const f=R.fw.find(x=>x.chain==='forward'&&x.content&&site.includes(x.content));
 if(f&&method==='https'){ok('Rule content "'+f.content+'" tidak memblokir HTTPS. Pakai DNS Static.')}
 else if(d){r.blocked='DNS Static'}
 else if(f){r.blocked='Firewall content'}
 L.push(r.blocked?['⛔','Situs '+site+' DIBLOKIR oleh '+r.blocked]:['✓','Situs '+site+' terbuka']);
 return r;
}
function runClient(){
 const site=$('cs').value.trim().toLowerCase().replace(/^https?:\/\//,'').split('/')[0];
 if(!site){$('co').innerHTML='<div class="no">Isi dulu situs yang mau dibuka</div>';return}
 const method=$('cm').value;
 const r=sim($('cu').value.trim(),$('cp').value,site,method);
 let html=r.log.map(([i,m])=>`<div class="${i==='✓'?'ok':'no'}">${esc(m)}</div>`).join('');
 if(r.dhcpFail)html='<div class="no">Klien: IP 169.254.x.x (DHCP gagal)</div>'+html;
 $('co').innerHTML=html;
}
function pingTest(){
 const host=$('cp2').value.trim()||'8.8.8.8';
 const u=R.user[0]||{};
 const r=sim(u.name,u.password,'google.com','https');
 const out=[];
 if(!r.net)out.push('<div class="no">Ping gagal: jaringan belum siap</div>');
 else{
   for(let i=1;i<=4;i++)out.push('<div class="ok">64 bytes from '+esc(host)+': icmp_seq='+i+' ttl=64 time='+(Math.random()*20+5).toFixed(1)+' ms</div>');
   out.push('<div class="ok">4 packets transmitted, 4 received, 0% packet loss</div>');
 }
 $('co').innerHTML=out.join('');
}
function clearClient(){
 $('co').innerHTML='';
 if($('cu'))$('cu').value='';
 if($('cp'))$('cp').value='';
 toast('Form klien dibersihkan');
}

const T=['facebook.com','tiktok.com'];
function mission(){
 const u=R.user[0]||{},t=s=>sim(u.name,u.password,s,'https');
 return [
  ['IP address di wlan1',R.addr.some(a=>a.interface==='wlan1')],
  ['IP Pool dibuat dan valid',R.pool.length>0&&R.pool.every(p=>V.pool(p)==='')],
  ['DHCP Server di wlan1',R.dhcp.some(d=>d.interface==='wlan1')],
  ['Hotspot Server di wlan1',R.hs.some(h=>h.interface==='wlan1')],
  ['User hotspot dibuat',R.user.length>0],
  ['NAT masquerade (srcnat)',R.fw.some(f=>f.chain==='srcnat'&&f.action==='masquerade')],
  ['DNS Servers diisi dan Allow Remote Requests aktif',!!(R.dnsSet.servers&&R.dnsSet.allow)],
  ['Klien bisa login dan membuka google.com',(x=>x.net&&!x.blocked)(t('google.com'))],
  ...T.map(s=>['Situs '+s+' terblokir',(x=>x.net&&!!x.blocked)(t(s))])
 ];
}

function exportCfg(){
 const blob=new Blob([JSON.stringify(R,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='mikrotik-config-'+Date.now()+'.json';a.click();
 toast('Config diexport');
}
function importCfg(ev){
 const f=ev.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=e=>{
   try{
     const j=JSON.parse(e.target.result);
     if(!j.addr)throw new Error('Format tidak valid');
     if(!j.dns)j.dns=[];if(!j.fw)j.fw=[];if(!j.dnsSet)j.dnsSet={servers:'',allow:false};
     pushUndo();R=j;save();render();toast('Config diimport');
   }catch(err){toast('Gagal import: '+err.message,true)}
 };
 rd.readAsText(f);
}

function genCLI(){
 const L=[];
 L.push('# Konfigurasi RouterOS dari state saat ini');L.push('');
 if(R.addr.length){L.push('# IP Address');R.addr.forEach(a=>L.push('/ip address add address='+a.address+' interface='+a.interface));L.push('')}
 if(R.pool.length){L.push('# IP Pool');R.pool.forEach(p=>L.push('/ip pool add name='+p.name+' ranges='+p.ranges));L.push('')}
 if(R.dhcp.length){L.push('# DHCP Server');R.dhcp.forEach(d=>L.push('/ip dhcp-server add name='+d.name+' interface='+d.interface+' address-pool='+d['address-pool']+' disabled=no'));L.push('')}
 if(R.hs.length){L.push('# Hotspot Server');R.hs.forEach(h=>L.push('/ip hotspot add name='+h.name+' interface='+h.interface+' address-pool='+h['address-pool']+' disabled=no'));L.push('')}
 if(R.user.length){L.push('# Hotspot User');R.user.forEach(u=>L.push('/ip hotspot user add name='+u.name+' password='+u.password));L.push('')}
 if(R.fw.length){L.push('# Firewall');R.fw.forEach(f=>{const parts=['/ip firewall filter add chain='+f.chain,'action='+f.action];if(f.content)parts.push('content="'+f.content+'"');if(f['out-interface'])parts.push('out-interface='+f['out-interface']);L.push(parts.join(' '))});L.push('')}
 if(R.dnsSet.servers||R.dnsSet.allow){L.push('# DNS');if(R.dnsSet.servers)L.push('/ip dns set servers='+R.dnsSet.servers);if(R.dnsSet.allow)L.push('/ip dns set allow-remote-requests=yes');L.push('')}
 if(R.dns.length){L.push('# DNS Static');R.dns.forEach(d=>L.push('/ip dns static add name='+d.name+' address='+d.address));L.push('')}
 if(L.length===1)L.push('(belum ada konfigurasi)');
 return L.join('\n');
}
function copyCLI(){
 const t=genCLI();
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('CLI dicopy'),()=>toast('Gagal copy',true))}
 else toast('Copy manual dari tab CLI',true);
}
function refreshCLI(){const el=$('cliout');if(el)el.textContent=genCLI();toast('CLI di-refresh')}

const SCEN={
 nat:{n:'NAT salah chain',do:()=>{R=D();R.addr=[{address:'192.168.88.1/24',interface:'wlan1'}];R.pool=[{name:'pool-hs',ranges:'192.168.88.10-192.168.88.254'}];R.dhcp=[{name:'dhcp1',interface:'wlan1','address-pool':'pool-hs'}];R.hs=[{name:'hotspot1',interface:'wlan1','address-pool':'pool-hs'}];R.user=[{name:'siswa1',password:'123'}];R.fw=[{chain:'forward',action:'masquerade',content:'','out-interface':'ether1'}];R.dnsSet={servers:'8.8.8.8',allow:true}}},
 dns:{n:'DNS belum allow remote',do:()=>{R=D();R.addr=[{address:'192.168.88.1/24',interface:'wlan1'}];R.pool=[{name:'pool-hs',ranges:'192.168.88.10-192.168.88.254'}];R.dhcp=[{name:'dhcp1',interface:'wlan1','address-pool':'pool-hs'}];R.hs=[{name:'hotspot1',interface:'wlan1','address-pool':'pool-hs'}];R.user=[{name:'siswa1',password:'123'}];R.fw=[{chain:'srcnat',action:'masquerade',content:'','out-interface':'ether1'}];R.dnsSet={servers:'8.8.8.8',allow:false}}},
 pool:{n:'Pool di luar subnet',do:()=>{R=D();R.addr=[{address:'192.168.88.1/24',interface:'wlan1'}];R.pool=[{name:'pool-hs',ranges:'10.10.10.10-10.10.10.200'}];R.dhcp=[{name:'dhcp1',interface:'wlan1','address-pool':'pool-hs'}];R.hs=[{name:'hotspot1',interface:'wlan1','address-pool':'pool-hs'}];R.user=[{name:'siswa1',password:'123'}];R.fw=[{chain:'srcnat',action:'masquerade',content:'','out-interface':'ether1'}];R.dnsSet={servers:'8.8.8.8',allow:true}}}
};
function loadScen(k){
 if(!confirm('Muat skenario "'+SCEN[k].n+'"? Konfigurasi saat ini akan diganti.'))return;
 pushUndo();SCEN[k].do();save();cur='ms';render();toast('Skenario dimuat');
}

function statusOf(k){
 if(k==='if'||k==='cl'||k==='cli'||k==='ms')return null;
 if(k==='dns'){const okDns=R.dns.length>0||(R.dnsSet.servers&&R.dnsSet.allow);return {ok:okDns,warn:!okDns}}
 const arr=R[k];
 if(!arr||!arr.length)return {ok:false,warn:true};
 const allOk=arr.every(o=>V[k](o)==='');
 return {ok:allOk,warn:!allOk};
}

function render(){
 $('m').innerHTML=MN.map(([k,n])=>{
   const st=statusOf(k);
   let badge='';
   if(st&&st.ok)badge='<span class="badge">✓</span>';
   else if(st&&st.warn)badge='<span class="badge warn">!</span>';
   return `<button onclick="cur='${k}';render()" class="${k===cur?'on':''}">${n}${badge}</button>`;
 }).join('');
 let b='';
 if(cur==='if'){
  b=win('Interface List',[['ether1','Uplink internet dari ISP (aktif)'],['ether2','Port LAN kabel'],['wlan1','Wi-Fi untuk klien hotspot; HP klien virtual tersambung di sini']].map(([a,c])=>`<div class="row"><b>${a}</b><span>${c}</span></div>`).join(''))
   +'<div class="hint on-dark">Urutan: IP ▸ Addresses → Pool → DHCP → Hotspot → User → Firewall (NAT) → DNS. Cek hasil di Misi.</div>';
 }else if(cur==='cl'){
  b=win('HP Klien (virtual) – via wlan1',`<div class="p">
   <label>Username hotspot</label><input id="cu" autocapitalize="none" placeholder="siswa1">
   <label>Password</label><input id="cp" autocapitalize="none" placeholder="123">
   <label>Situs yang dibuka</label><input id="cs" value="google.com" autocapitalize="none">
   <label>Protokol</label><select id="cm"><option value="https">HTTPS (443)</option><option value="http">HTTP (80)</option></select>
   <div class="bar" style="padding:10px 0;border:none">
     <button type="button" onclick="runClient()">Sambungkan</button>
     <button type="button" onclick="pingTest()">Ping</button>
     <button type="button" onclick="clearClient()">Clear</button>
   </div>
   <label>Host ping</label><input id="cp2" value="8.8.8.8" autocapitalize="none">
   <div id="co" style="margin-top:10px"></div>
  </div>`);
 }else if(cur==='cli'){
  b=win('Konfigurasi CLI (RouterOS)',`<div class="bar"><button type="button" onclick="copyCLI()">Copy</button><button type="button" onclick="refreshCLI()">↻ Refresh</button></div><div class="cli" id="cliout">${esc(genCLI())}</div>`);
 }else if(cur==='ms'){
  const m=mission(),n=m.filter(x=>x[1]).length;
  const cfgSummary=[['IP',R.addr.length],['Pool',R.pool.length],['DHCP',R.dhcp.length],['Hotspot',R.hs.length],['User',R.user.length],['Firewall',R.fw.length],['DNS',R.dns.length]].map(([k,v])=>`<span style="display:inline-block;background:#0a246a;color:#fff;padding:2px 8px;border-radius:10px;margin:2px;font-size:11px">${k}: ${v}</span>`).join('');
  b=win('Misi',`<div class="p"><b>Skor ${n}/${m.length}</b><div class="hint" style="padding:4px 0">Buat hotspot di wlan1 sampai klien bisa login, lalu blokir ${T.join(' dan ')}.</div><div style="margin:8px 0">${cfgSummary}</div></div>`
   +m.map(x=>`<div class="row"><span>${x[1]?'✅':'⬜'} ${x[0]}</span></div>`).join('')
   +`<div class="bar" style="flex-wrap:wrap">
     <button type="button" onclick="exportCfg()">⬇ Export</button>
     <button type="button" onclick="document.getElementById('impf').click()">⬆ Import</button>
     <button type="button" onclick="reset()">Reset</button>
     <input type="file" accept=".json" onchange="importCfg(event)" style="display:none" id="impf">
   </div>`
   +`<div class="bar" style="flex-wrap:wrap">
     <span style="font-size:12px;font-weight:bold">Troubleshoot:</span>
     ${Object.entries(SCEN).map(([k,s])=>`<button type="button" onclick="loadScen('${k}')">${s.n}</button>`).join('')}
   </div>`);
 }else{
  const s=S[cur];
  let top='';
  if(cur==='dns')top=`<div class="p" style="border-bottom:1px solid #aaa">
    <b>DNS Settings</b>
    <label>Servers</label><input value="${esc(R.dnsSet.servers)}" placeholder="8.8.8.8" autocapitalize="none" onchange="R.dnsSet.servers=this.value.trim();save();render()">
    <div class="helper">DNS upstream, misal 8.8.8.8</div>
    <label class="chk"><input type="checkbox" ${R.dnsSet.allow?'checked':''} onchange="R.dnsSet.allow=this.checked;save();render()">Allow Remote Requests</label>
    <div class="helper">Wajib aktif agar klien bisa resolve DNS</div>
   </div>`;
  const rows=R[cur].map((o,i)=>`<div class="row"><span>${i}. ${Object.entries(o).filter(e=>e[1]).map(([a,v])=>`<b>${a}</b>=${esc(v)}`).join(' ')}</span><span class="rowacts"><button type="button" onclick="form('${cur}',${i})" title="Edit">✎</button><button type="button" onclick="dup('${cur}',${i})" title="Duplicate">⧉</button><button type="button" onclick="del('${cur}',${i})" title="Hapus">✕</button></span></div>`).join('')||'<div class="hint">(kosong)</div>';
  b=win(s.t,top+`<div class="bar"><button type="button" onclick="form('${cur}')">＋ Add</button><span class="hint" style="padding:0">${R[cur].length} item</span></div>`+rows)+(H[cur]?`<div class="hint on-dark">${H[cur]}</div>`:'');
 }
 $('v').innerHTML=b;
 const m=mission(),n=m.filter(x=>x[1]).length;
 let fp=$('fp');
 if(!fp){fp=document.createElement('div');fp.id='fp';fp.className='prog';fp.onclick=()=>{cur='ms';render()};document.body.appendChild(fp)}
 fp.innerHTML=`<span>Misi ${n}/${m.length}</span><div class="bar-in"><div style="width:${(n/m.length*100).toFixed(0)}%"></div></div><span>${n===m.length?'✅ Selesai':'→'}</span>`;
}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('mtDark',document.body.classList.contains('dark')?'1':'0')}
if(localStorage.getItem('mtDark')==='1')document.body.classList.add('dark');

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeD();
 if(e.key==='Enter'&&document.getElementById('dlg')&&document.activeElement.tagName==='INPUT'){
   e.preventDefault();
   const btn=[...document.querySelectorAll('#dlg button')].find(b=>b.textContent==='OK');
   if(btn)btn.click();
 }
});

render();
</script>
</body>
</html>
